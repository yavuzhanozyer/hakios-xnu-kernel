# devices/surya/device.conf: what this device repository is (docs/porting/repositories.md has every word). The device's page
# (docs/devices/surya.md) is made from it. Only what has been seen on the phone under HakiOS is `works`; what is written and
# not yet seen is `partial`, with what it rests on.

device surya
	title       POCO X3 NFC
	vendor      Xiaomi
	soc         sm7150
	defconfig   surya_defconfig
	firmware    pull-firmware.sh
	maintainer  yavuzhanozyer
	status      display     partial   UEFI's framebuffer (1080 x 2400 at 0x9c000000, Mu-Silicium's suryaPkg) through the loader (platform sm7150); drawn by the CPU
	status      touch       partial   Novatek NT36672C on SPI, firmware sent over SPI (CONFIG_HAKIOS_NT36672C, touchscreen=1): the ios-sweet driver that works on this phone, moved here; not yet run under HakiOS
	status      buttons     partial   power and volume through the PM6150 / PM6150L (CONFIG_HAKIOS_BUTTONS, buttons_pon=0x008 buttons_pon_gen=2 buttons_volup=0x4c1): the addresses ios-sweet reads them at; not yet run under HakiOS
	status      cpu         partial   8 cores, the kernel on core 7, an A76 (cpus=8 bootcpu=7): all eight ran under ios-sweet; the processor clocks (OSM) are not driven
	status      storage     partial   UFS read through the loader (ufs=2, UEFI's block devices): the loader's, not yet run on this phone
	status      gpu         missing   Adreno 618: hakios.adreno.c is the 642L's
	status      audio       missing   the audio DSP's addresses are the SC7280's
	status      battery     missing   no charger or fuel gauge driver for the PM6150 / PM7150B
	status      haptic      missing
	status      camera      missing
	status      wifi        missing   WCN3990-family radio (not the WCN6750 of hakios.wifi.c)
	status      bluetooth   missing
	status      cellular    missing   soc_* not yet read from this phone's device tree (pull-soc.sh)
	status      thermal     missing   TSENS at 0xc222000 / 0xc223000, not the SC7280's
