# devices/surya/device.conf: what this device repository is (docs/porting/repositories.md has every word). The device's page
# (docs/devices/surya.md) is made from it. Only what has been seen on the phone under HakiOS is `works`; what is written and
# not yet seen is `partial`, with what it rests on.

device surya
	title       POCO X3 NFC
	vendor      Xiaomi
	soc         sm7150
	defconfig   surya_defconfig
	firmware    pull-firmware.sh
	maintainer  yavuzhanozyer
	status      display     works     UEFI's framebuffer (1080 x 2400 at 0x9c000000) through the loader: the lock screen, its clock going on (2 November 2026); drawn by the CPU
	status      touch       works     Novatek NT36672C on SPI, its firmware sent over SPI: the lock screen unlocked by a swipe (CONFIG_HAKIOS_NT36672C, touchscreen=1; moves limited by touch_move_px/_ms), 2 November 2026
	status      buttons     works     power and volume through the PM6150 / PM6150L, seen working in iOS (CONFIG_HAKIOS_BUTTONS, buttons_pon=0x008 buttons_pon_gen=2 buttons_volup=0x4c1), 2 November 2026
	status      cpu         works     8 cores, the kernel on core 7 (cpus=8 bootcpu=7; the timer is INTID 19 here, vtimer_intid=19 from the loader); the clocks through OSM: the small cores at 1804 MHz, the big at 2304 MHz (cpufreq=1 cpufreq_osm=1), 2 November 2026
	status      storage     partial   UFS read through the loader (ufs=2, UEFI's block devices): the loader's, not yet run on this phone
	status      gpu         partial   Adreno 618: steps 1 to 6 of hakios.adreno.c ported (adreno=6 adreno_a618=1): CX on, the GMU's clock at 200 MHz, its always-on counter at 19.2 MHz, "THE GPU BLOCK IS ALIVE" (2 November 2026); the GMU's firmware, HFI and the 3D core not yet
	status      audio       works     both speakers, in stereo: the audio DSP (adsp=1 adsp_sm7150=1), TERT MI2S through it, the TAS2562s at 0x4c (right, reset GPIO 91) and 0x4d (left, reset the PM6150L's GPIO 8); what iOS plays and its volume (sound=4), 12 dB under the amplifiers' 0 dB (sound_below=96), 3 November 2026; no speaker protection (the DSP's under Android), no microphones
	status      battery     partial   the level in iOS from UEFI's Qualcomm charger drivers, read by the loader (battery=1), seen 2 November 2026; charging under this kernel is the firmware's, not seen
	status      haptic      missing
	status      camera      missing
	status      wifi        partial   WCN3990: its firmware's service (WLFW, 69) comes up on the modem (modem_sm7150=1 modem=..., ufs=2): the modem's user domain msm/modem/wlan_pd found in the registry (modemuw.jsn), wlanmdsp.mbn read over TFTP (3 November 2026); the WLFW exchange (ath10k's), the chip's rails, the MSA memory and the radio's driver (ath10k snoc) not yet
	status      bluetooth   missing
	status      cellular    partial   the modem runs (modem_sm7150=1, ufs=2 for its file systems): TrustZone takes its image, up 22 ms after its start, GLINK and QRTR with it, 39 services, its files over TFTP and the registry answered (3 November 2026); no IPA (v4.2), no SIM or network asked yet
	status      thermal     works     both TSENS v2 blocks, 25 of 32 sensors read, 43 to 51 C (thermal=1 thermal_table=2, 2 November 2026); the stop at 105 C not seen firing
